name: NOIRA1M Agent

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt

      - name: Run agent
        run: python orchestrator.py

      - name: Commit data
        run: |
          git config user.name "noira1m-bot"
          git config user.email "bot@noira1m.ai"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: agent data [skip ci]"
          git push origin master || echo "No changes"
