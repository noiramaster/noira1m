name: NOIRA1M Agent

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python orchestrator.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit agent state
        run: |
          git config user.name "noira1m-bot"
          git config user.email "bot@noira1m.ai"
          git add data/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: agent heartbeat [skip ci]"
          git push origin master || echo "No changes"
